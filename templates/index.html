<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <h1>Email Spam Detection</h1>
        <p>Paste an email below to check whether it looks like spam.</p>

        <form method="POST">
            <label for="email_text">Email text</label>
            <textarea
                id="email_text"
                name="email_text"
                rows="8"
                placeholder="Paste the email here..."
                required
            >{{ email_text }}</textarea>

            <button type="submit">Check email</button>
        </form>

        {% if result %}
            <div class="result {% if result == 'Spam' %}spam{% else %}ham{% endif %}">
                Result: {{ result }}
            </div>
        {% endif %}
    </main>
</body>
</html>
